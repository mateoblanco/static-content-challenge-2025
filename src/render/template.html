<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acme</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/reset.css" />
  <link rel="stylesheet" href="/styles.css" />

  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
  <link rel="manifest" href="/favicon/site.webmanifest">

</head>

<body>
  <header>
    <div class="header-content">
      <h1 class="logo">Acme</h1>
    </div>
  </header>

  <main>
    {{content}}
  </main>

  <footer>
    <div class="footer-content">
      <p>&copy; Copyright Acme Company 2026. All Rights Reserved</p>
      <nav class="social-links" aria-label="Social media">
        <a href="https://www.facebook.com" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
          <img src="/assets/facebook.svg" alt="" width="16" height="16" />
        </a>
        <a href="https://x.com" target="_blank" rel="noopener noreferrer" aria-label="X">
          <img src="/assets/x_twitter.svg" alt="" width="16" height="16" />
        </a>
        <a href="https://www.linkedin.com" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
          <img src="/assets/linkedin.svg" alt="" width="16" height="16" />
        </a>
      </nav>
    </div>
  </footer>
</body>

</html>
